<h1>Life on the Mac</h1>
<p>Life on the Mac is a private, single-user tool. It runs on one computer at home and reads its owner's own Google mail, calendar and contacts so that they show up in a personal daily overview. It is not offered to anyone else, and no one else can sign in to it.</p>
